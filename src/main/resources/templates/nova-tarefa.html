<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nova Tarefa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Nova Tarefa para: <span th:text="${projeto.nome}">Projeto</span></h4>
        </div>
        <div class="card-body">
            
            <form th:action="@{'/projeto/' + ${projeto.id} + '/tarefa/salvar'}" th:object="${tarefa}" method="post">
                <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
                    <p class="mb-1" th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></p>
                    <p class="mb-0" th:if="${#fields.hasErrors('prazo') or #fields.hasErrors('pesoPercentual')}">Confira o formato da data e do peso informado.</p>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Título da Tarefa</label>
                    <input type="text" class="form-control" th:field="*{titulo}" maxlength="255" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Descrição</label>
                    <textarea class="form-control" th:field="*{descricao}" rows="3" maxlength="255" required></textarea>
                </div>

                <div class="mb-3">
                    <label for="responsavelId" class="form-label">Responsável</label>
                    <select id="responsavelId" name="responsavelId" class="form-select">
                        <option value="">Sem responsável</option>
                        <option th:each="colaborador : ${colaboradores}" th:value="${colaborador.id}"
                                th:text="${colaborador.nome}" th:selected="${colaborador.id == responsavelSelecionado}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="prazo" class="form-label">Prazo (opcional)</label>
                    <input type="date" class="form-control" th:field="*{prazo}">
                </div>
                <div class="mb-3">
                    <label for="pesoPercentual" class="form-label">Peso no projeto (%) — opcional</label>
                    <input type="number" class="form-control" th:field="*{pesoPercentual}" min="0.01" max="100" step="0.01">
                    <div class="form-text">Sem peso informado, as tarefas dividem igualmente o percentual restante do projeto.</div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a th:href="@{'/projeto/' + ${projeto.id} + '/tarefas'}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Salvar Tarefa</button>
                </div>
            </form>
            
        </div>
    </div>
</div>
</body>
</html>
