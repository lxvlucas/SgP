<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SgP - Não foi possível abrir a página</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container mt-5">
    <h1>Não foi possível abrir esta página</h1>
    <p th:if="${status == 404}">O endereço não existe ou o registro foi removido.</p>
    <p th:unless="${status == 404}">Não foi possível concluir a solicitação. Confira os dados e tente novamente.</p>
    <a href="/" class="btn btn-primary">Voltar ao painel</a>
</main>
</body>
</html>
