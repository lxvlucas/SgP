# Sem fallback para PG*: o inicializador exige uma conexão exclusiva de teste.
spring.datasource.url=${TEST_DATABASE_URL}
spring.datasource.username=${TEST_DATABASE_USERNAME}
spring.datasource.password=${TEST_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
sgp.dados-demonstracao.enabled=true
